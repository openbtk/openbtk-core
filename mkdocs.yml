site_name: OpenBTK
site_description: The open-source layer between biomedical data and modern AI.
site_url: https://openbtk.org/openbtk-core/
repo_url: https://github.com/openbtk/openbtk-core
repo_name: openbtk/openbtk-core
edit_uri: edit/main/mkdocs/

docs_dir: mkdocs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Tutorials: tutorials.md
  - Guides:
      - Clinical text: guides/clinical-text.md
      - De-identification: guides/deidentification.md
      - EHR: guides/ehr.md
      - Evaluation: guides/evaluation.md
      - Command line: guides/cli.md
      - LangChain & LangGraph: langchain.md
  - Benchmarks: benchmarks.md
  - Stability policy: stability.md
  - API reference:
      - Core: api/core.md
      - De-identification: api/deid.md
      - Clinical text: api/clinical_text.md
      - EHR: api/ehr.md
      - Pipelines: api/pipelines.md
      - Providers: api/providers.md
      - Retrieval: api/retrieval.md
      - Guardrails: api/guardrails.md
      - Terminology: api/terminology.md
      - Evaluation: api/eval.md
      - LangChain adapter: api/integrations.md

# CI builds with --strict, so any warning fails the docs build. One class of
# warning is worth knowing about: mkdocstrings/mkdocs_autorefs misreads a
# doctest whose OUTPUT line is a Python list-of-strings literal (for example
# ['a', 'b']) as an attempted cross-reference. The fix is in the docstring, not
# a suppression here: write the example as `... == ["a", "b"]` with output `True`.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra:
  version:
    provider: mike
