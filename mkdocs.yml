site_name: OpenBTK
site_description: The open-source layer between biomedical data and modern AI.
site_url: https://openbtk.github.io/openbtk-core/
repo_url: https://github.com/openbtk/openbtk-core
repo_name: openbtk/openbtk-core
edit_uri: edit/main/mkdocs/

docs_dir: mkdocs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - API reference:
      - Core: api/core.md
      - De-identification: api/deid.md
      - Clinical text: api/clinical_text.md
      - Pipelines: api/pipelines.md

# Known, harmless false positive (verified, not silently worked around):
# mkdocstrings/mkdocs_autorefs misreads a couple of this codebase's real
# doctest Example blocks -- specifically, an >>> call's OUTPUT line that is
# itself a Python list-of-strings literal (e.g. ['one two ', 'three four'])
# -- as an attempted cross-reference, and warns that it cannot resolve it.
# The rendered API page is correct either way; only `mkdocs build --strict`
# treats the warning as fatal, which is why CI's docs.yml builds without
# --strict. Tracked as a real, disclosed limitation of the doctest+
# mkdocstrings combination, not swept under a blanket warning suppression.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra:
  version:
    provider: mike
