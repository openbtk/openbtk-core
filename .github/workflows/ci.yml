name: CI

on:
  push:
    # feat/** and fix/**: feature branches get the same zero-extras matrix BEFORE
    # merge. M6/M7 broke test-core on main because branch work was never run here.
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  FORCE_COLOR: "1"

# NOTE: jobs are added as milestones deliver the code they test. A CI file that
# references paths which do not exist is how v1's workflow came to point at
# `src.core` and `mypy openbtk`, neither of which resolved. Current: M0.
# Pending: test-modules (M3), test-security (M1), test-accuracy (M2), docs (M4).
# test-langchain / test-no-langchain (M8) are the two halves of ADR-0001.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Layer boundaries (ADR-0001, ADR-0003)
        run: lint-imports

      - name: Forbidden package names
        run: |
          if grep -rnE "opentbtk|from src\.|import src\." \
              --include="*.py" --include="*.toml" \
              src tests \
              | grep -v "tests/packaging/test_install.py"; then
            echo "::error::Forbidden package name. The package is 'openbtk', always. See ADR-0003."
            exit 1
          fi

      - name: No load_all() in docs or examples
        run: |
          if grep -rn "load_all(" README.md notebooks 2>/dev/null; then
            echo "::error::load_all() materialises a corpus. Examples must model streaming. See ADR-0004."
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # [langchain]: openbtk.integrations.langchain subclasses langchain-core
      # types at import time, so mypy needs them to check it.
      - run: pip install -e ".[dev,langchain]"
      - run: mypy --strict

  # The widest matrix in the project. Installability across platforms is where
  # v1 died, and this job is the direct answer to it.
  test-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs derives the version from git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install core + dev ONLY (zero optional extras)
        run: pip install -e ".[dev]"

      - name: Import with zero extras
        run: python -c "import openbtk; print(openbtk.__version__)"

      # Run from a directory outside the repository. A path-relative import
      # cannot satisfy the suite from here -- which is the point of src/ layout.
      - name: Test suite (from outside the repository)
        working-directory: ${{ runner.temp }}
        shell: bash
        run: pytest "${{ github.workspace }}/tests" -v -p no:cacheprovider

  # v0.5 gate "FHIR R4 + OMOP loaders; Synthea round-trip": test-core installs
  # zero extras, so its EHR tests skip (by design). This job installs [ehr] and
  # FAILS if any of them still skips, so the gate is demonstrated, not assumed.
  test-ehr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ehr]"
      - name: EHR tests, none skipped (from outside the repository)
        working-directory: ${{ runner.temp }}
        run: |
          pytest "${{ github.workspace }}/tests/unit/data/ehr" \
                 "${{ github.workspace }}/tests/integration/test_ehr_pipeline.py" \
                 "${{ github.workspace }}/tests/integration/test_guardrail_pipeline.py" \
                 -q -p no:cacheprovider --junitxml=ehr.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("ehr.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          skipped, tests = int(suite.get("skipped")), int(suite.get("tests"))
          assert tests > 50, f"suspiciously few EHR tests ran: {tests}"
          assert skipped == 0, f"{skipped} EHR tests skipped -- [ehr] extra not effective"
          print(f"{tests} EHR tests, 0 skipped")
          PY

  # ADR-0001, half one: the adapter really works against real langchain-core
  # and langgraph (not mocks of them).
  test-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,langchain,langgraph]"
      - name: Adapter tests (from outside the repository)
        working-directory: ${{ runner.temp }}
        run: pytest "${{ github.workspace }}/tests/unit/integrations" -v -p no:cacheprovider

  # ADR-0001, half two: everything else works with langchain-core ABSENT.
  test-no-langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ehr]"   # deliberately NOT [langchain]
      - name: Confirm langchain-core and langgraph are really absent
        run: |
          python - <<'PY'
          import importlib.util
          present = [m for m in ("langchain_core", "langchain", "langgraph")
                     if importlib.util.find_spec(m)]
          assert not present, f"test-no-langchain would prove nothing: {present} installed"
          PY
      - name: Suite passes without langchain (adapter tests excluded)
        working-directory: ${{ runner.temp }}
        run: pytest "${{ github.workspace }}/tests" --ignore="${{ github.workspace }}/tests/unit/integrations" -q -p no:cacheprovider

  # Every code example on the documentation site is executed. Some need an extra
  # (the EHR guide needs [ehr]; the adapter's API page needs [langchain]), which
  # test-core does not install, so this job installs them and FAILS if anything
  # skipped -- otherwise those examples would never run anywhere.
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ehr,langchain,langgraph]"
      - name: Docs examples, none skipped (from outside the repository)
        working-directory: ${{ runner.temp }}
        run: |
          pytest "${{ github.workspace }}/tests/docs" \
                 "${{ github.workspace }}/tests/unit/integrations/test_docs_page.py" \
                 -q -p no:cacheprovider --junitxml=docs.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("docs.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          skipped, tests = int(suite.get("skipped")), int(suite.get("tests"))
          assert tests > 25, f"suspiciously few docs tests ran: {tests}"
          assert skipped == 0, f"{skipped} docs tests skipped -- an extra is missing"
          print(f"{tests} docs tests, 0 skipped")
          PY

  # The docs site builds with --strict on every branch, so a broken cross-reference
  # or an unresolvable API directive is caught before merge, not after (docs.yml
  # only runs on main). [langchain] because the adapter's API page imports it.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs,langchain]"
      - run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel is correctly laid out
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          assert any(n.startswith("openbtk/") for n in names), names[:20]
          assert not any(n.startswith("src/") for n in names), "src/ prefix leaked into the wheel"
          assert "openbtk/py.typed" in names, "py.typed missing from the wheel"
          assert any("licenses/LICENSE" in n for n in names), "LICENSE missing from the wheel"
          print("wheel OK:", wheel)
          PY
