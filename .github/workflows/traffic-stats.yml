name: Traffic stats

# GitHub's traffic API only ever returns a rolling 14-day window and needs a token
# with push access to read -- there is no public badge for it. This job authenticates
# with TRAFFIC_TOKEN, folds the last 14 days into the running history kept on the
# metrics-data branch, and regenerates the shields.io endpoint-badge files the
# README reads from. It never touches main: metrics-data is a separate, unprotected
# branch that holds only generated data.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to push the regenerated history/badges to metrics-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (for the script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out metrics-data (for the data)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: metrics-data
          path: metrics-data

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fetch traffic and update history + badges
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_DATA_DIR: metrics-data
        run: python scripts/update_traffic_stats.py

      - name: Commit and push if changed
        working-directory: metrics-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No traffic changes today."
            exit 0
          fi
          git add history.json badges/
          git commit -m "update traffic stats"
          git push origin metrics-data
