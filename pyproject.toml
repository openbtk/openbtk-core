# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "openbtk"
dynamic = ["version"]
description = "The open-source layer between biomedical data and modern AI: de-identified, auditable, model-ready inputs with clinical guardrails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "OpenBTK Contributors" }]
keywords = [
    "biomedical", "healthcare", "clinical-nlp", "de-identification",
    "phi", "ehr", "fhir", "omop", "llm", "rag", "hipaa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Core dependencies -- HARD LIMIT OF SIX. A seventh requires an ADR.
# Deliberately absent: langchain, langgraph, torch, transformers, spacy.
# Reading a clinical note must not require an ML framework. See ADR-0001.
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.5",
    # <2.5: numpy 2.5.0 dropped Python 3.11 support and its bundled .pyi
    # stubs adopted PEP 695 syntax (the `type X = ...` statement), which is
    # a hard mypy parse error under python_version=3.11 (verified against
    # openbtk's actual floor -- see [tool.mypy] below, and
    # https://github.com/python/mypy/issues/18701). Revisit this bound when
    # openbtk's own minimum Python version moves to 3.12+.
    "numpy>=1.26,<2.5",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typing-extensions>=4.12",
]

[project.scripts]
openbtk = "openbtk.cli:main"

[project.optional-dependencies]
text = [
    "scispacy>=0.5",
    "medspacy>=1.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "transformers>=4.40",
    # openbtk.deid.recognizers.ner: general-purpose PERSON/GPE/LOC/FAC NER.
    # Deliberately spaCy's own small English pipeline, not a scispaCy
    # biomedical model -- see that module's docstring for why (scispaCy's
    # off-the-shelf models target scientific entities, not names/places).
    "spacy>=3.8",
    # openbtk.data.clinical_text.loaders.MIMICNotesLoader: chunked CSV
    # reading (docs/05_DATA_MODALITY_SPEC.md section 1.2). Also listed
    # under `ehr` (its own, larger reason there); duplicated here
    # deliberately since clinical_text must not depend on the ehr extra.
    "pandas>=2.2",
]
ehr = [
    "fhir.resources>=7.1",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "hl7apy>=1.3",
]
retrieval = [
    "faiss-cpu>=1.8",
    "chromadb>=0.5",
    # openbtk.retrieval.qdrant: task 5.6's roadmap entry names FAISS,
    # Chroma AND Qdrant explicitly, but this extra never listed the
    # package the third one needs -- added here, not assumed present.
    "qdrant-client>=1.9",
]
llms = [
    "openai>=1.30",
    "anthropic>=0.30",
    # For HuggingFaceLocalProvider (task 5.2): transformers (the "text"
    # extra) needs a real tensor backend to run text generation, and does
    # not pull one in itself -- torch is deliberately absent from "text"
    # since that extra's own transformers usage (tokenization only, in
    # data.clinical_text.tokenization) never needs it.
    "torch>=2.0",
]
# openbtk.llms.bedrock: AWS Bedrock through its Converse API.
bedrock = [
    "boto3>=1.34",
]
# openbtk.llms.vertex: Google Vertex AI through the google-genai SDK.
vertex = [
    "google-genai>=1.0",
]
# First candidate for carve-out into its own distribution: its version must be
# free to track langchain-core independently of ours. See ADR-0002.
langchain = [
    "langchain-core>=0.3",
]
# Only needed to build and run a real LangGraph graph around
# openbtk.integrations.langchain.as_langgraph_node. The adapter itself imports
# neither langgraph nor anything beyond langchain-core (a node is a plain
# callable); this extra exists so the node contract is tested against the
# real library. Optional, never a core dependency (ADR-0001).
langgraph = [
    "langgraph>=0.2",
]
# To execute the tutorial notebooks in notebooks/ (CI runs every one of them).
notebooks = [
    "nbclient>=0.10",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]
all = ["openbtk[text,ehr,retrieval,llms,bedrock,vertex,langchain,langgraph]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.7",
    "faker>=25.0",
    "types-PyYAML>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.1",
]

[project.urls]
Homepage = "https://github.com/openbtk/openbtk-core"
Repository = "https://github.com/openbtk/openbtk-core"
Issues = "https://github.com/openbtk/openbtk-core/issues"

[project.entry-points."openbtk.providers"]
# Third-party packages register components here in their own pyproject.toml.

# ---------------------------------------------------------------------------
# Versioning -- derived from git tags. There is no version string to forget
# to bump, and none that can drift from the tag. See docs/08_CICD_RELEASE.md.
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/openbtk"]

[tool.hatch.build.targets.sdist]
include = ["src/openbtk", "tests", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "TC",        # flake8-type-checking
    "RUF",       # ruff-specific
    "PTH",       # flake8-use-pathlib
    "RET",       # flake8-return
    "ARG",       # flake8-unused-arguments
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez -- naive clinical timestamps are a real bug class
    "T20",       # flake8-print -- no print() in library code
]
ignore = [
    "ANN401",    # Any permitted where documented in docs/04_API_DESIGN.md section 11.4
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"notebooks/**" = ["ANN", "ARG", "T20", "E501"]   # tutorials print and read top-to-bottom
"src/openbtk/cli/**" = ["T20"]     # the CLI prints legitimately

[tool.ruff.lint.isort]
known-first-party = ["openbtk"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/openbtk"]
# Pydantic's official plugin, required for mypy to correctly understand
# default_factory=SomeModel and Field(None, ...)-style optional fields in
# synthesized __init__ signatures. Without it, mypy's generic stub-based
# inference produces false "missing argument" / "incompatible default_factory"
# errors on patterns that are entirely valid Pydantic v2 -- found the hard way
# in core/config.py, whose earlier models (dict/list default_factory only)
# never exercised this gap.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "scispacy.*", "medspacy.*", "spacy.*",
    "presidio_analyzer.*", "presidio_anonymizer.*",
    "transformers.*", "fhir.*", "hl7apy.*",
    "faiss.*", "chromadb.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Import boundaries -- makes the layering in docs/03_ARCHITECTURE.md section 2
# executable rather than aspirational.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "openbtk"
# Required so the forbidden-modules contract can see external packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture -- imports go strictly downward"
type = "layers"
layers = [
    "openbtk.cli",
    "openbtk.pipelines",
    "openbtk.data",
    "openbtk.deid",
    "openbtk.core",
]

[[tool.importlinter.contracts]]
name = "Modalities are independent of one another"
type = "independence"
modules = [
    "openbtk.data.clinical_text",
    "openbtk.data.ehr",
]

[[tool.importlinter.contracts]]
name = "LangChain confined to its adapter (ADR-0001)"
type = "forbidden"
source_modules = [
    "openbtk.core",
    "openbtk.data",
    "openbtk.deid",
    "openbtk.pipelines",
    "openbtk.guardrails",
    "openbtk.terminology",
    "openbtk.embeddings",
    "openbtk.llms",
    "openbtk.retrieval",
    "openbtk.eval",
    "openbtk.cli",
]
forbidden_modules = ["langchain", "langchain_core", "langgraph"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: requires model downloads (skipped unless OPENBTK_SLOW_TESTS=1)",
    "network: requires network access",
    "gpu: requires CUDA",
    "benchmark: performance test, nightly only (skipped unless OPENBTK_RUN_BENCHMARKS=1)",
    "credentialed: needs user-supplied restricted data (i2b2/MIMIC); always skipped in CI",
]
# Later entries win: third-party DeprecationWarnings are ignored, but OpenBTK's own
# deprecation warning is an ERROR here, so nothing inside OpenBTK (or its tests) may
# call a deprecated OpenBTK API -- a deprecation is only ever exercised on purpose,
# under pytest.warns.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "error::openbtk.core.deprecation.OpenBTKDeprecationWarning",
]

[tool.coverage.run]
source = ["openbtk"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
